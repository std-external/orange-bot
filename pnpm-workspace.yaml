# Only packages that can stand on their own are workspace members.
#
# packages/orange-ext is deliberately absent: it is a plugin of the crossgram
# monorepo and imports `@mtproto-relay/bridge` from there (`workspace:*`), so it
# cannot resolve or build inside this workspace. Its source is kept here and is
# meant to be dropped into crossgram's own packages/ — see its README.
packages:
  - packages/dsh-plugin-orange
  - packages/koishi-plugin-orange-bridge
